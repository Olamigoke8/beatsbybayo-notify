<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Admin · BeatsByBayo</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: var(--color-bg); color: var(--color-text); }
    .admin-wrap { max-width: 980px; margin: 0 auto; padding: var(--space-12) var(--space-6); }
    .admin-wrap h1 { font-family: var(--font-display); font-size: var(--text-3xl); margin-bottom: var(--space-6); }
    .login-card, .admin-card {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-lg); padding: var(--space-8); box-shadow: var(--shadow-card);
    }
    .login-card { max-width: 420px; }
    .login-card label { display: grid; gap: var(--space-2); font-size: var(--text-sm); color: var(--color-text-muted); }
    .login-card input {
      background: var(--color-bg); border: 1px solid var(--color-border);
      border-radius: var(--radius-sm); padding: var(--space-3) var(--space-4); color: var(--color-text);
      font-size: var(--text-base);
    }
    .login-card .btn { margin-top: var(--space-5); }
    .err-msg { color: #e67e22; font-size: var(--text-sm); margin-top: var(--space-3); min-height: 1.2em; }
    .pricing-block { margin-bottom: var(--space-8); }
    .pricing-block h2 { font-family: var(--font-display); font-size: var(--text-xl); margin-bottom: var(--space-3); }
    table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
    th, td { text-align: left; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--color-border); }
    th { color: var(--color-text-muted); font-weight: 600; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: var(--text-xs); }
    .pill.new { background: rgba(230,126,34,0.15); color: #e67e22; }
    .pill.sent { background: rgba(46,204,113,0.15); color: #2ecc71; }
    .pill.fail { background: rgba(231,76,60,0.15); color: #e74c3c; }
    .pill.skip { background: rgba(255,255,255,0.08); color: var(--color-text-faint); }
    .inq { border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-4); background: var(--color-bg); }
    .inq h3 { font-size: var(--text-base); margin-bottom: var(--space-2); }
    .inq p { font-size: var(--text-sm); color: var(--color-text-muted); margin: 2px 0; }
    .meta { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-3); }
    .logout { float: right; font-size: var(--text-sm); color: var(--color-accent); cursor: pointer; background: none; border: none; text-decoration: underline; }
    .inq.booked { border-color: #2ecc71; background: rgba(46,204,113,0.05); }
    .inq .book-btn { margin-top: var(--space-3); font-size: var(--text-sm); padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); }
    .inq .book-btn.is-booked { background: rgba(46,204,113,0.15); color: #2ecc71; border-color: #2ecc71; }
    .booked-bar { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
    .booked-chip { background: rgba(46,204,113,0.15); color: #2ecc71; padding: 4px 12px; border-radius: 999px; font-size: var(--text-sm); }
    .empty { color: var(--color-text-faint); font-size: var(--text-sm); }
    .rev { border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-4); background: var(--color-bg); }
    .rev.pending { border-color: #e67e22; background: rgba(230,126,34,0.04); }
    .rev h3 { font-size: var(--text-base); margin-bottom: var(--space-2); }
    .rev p { font-size: var(--text-sm); color: var(--color-text-muted); margin: 2px 0; }
    .rev .stars { color: #e67e22; letter-spacing: 1px; }
    .rev .actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
    .act-btn { font-size: var(--text-sm); padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); }
    .act-btn.approve { background: rgba(46,204,113,0.15); color: #2ecc71; border-color: #2ecc71; }
    .act-btn.reject { background: rgba(231,76,60,0.1); color: #e74c3c; border-color: rgba(231,76,60,0.4); }
    .request-btn { margin-top: var(--space-3); font-size: var(--text-sm); padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); margin-left: 8px; }
    .copy-link { font-size: var(--text-sm); color: var(--color-accent); cursor: pointer; background: none; border: none; text-decoration: underline; display: block; margin-bottom: var(--space-4); }
    .pay-btn, .pay-check-btn { margin-top: var(--space-3); font-size: var(--text-sm); padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); margin-left: 8px; }
    .pay-btn { border-color: rgba(0,250,230,.5); color: #00FAE6; background: rgba(0,250,230,.08); }
    .pay-btn:hover { background: rgba(0,250,230,.18); }
    .pay-bar { margin-top: var(--space-3); padding: 10px 12px; border-radius: var(--radius-sm); background: rgba(0,250,230,.05); border: 1px solid rgba(0,250,230,.2); font-size: var(--text-sm); }
    .pay-bar .pay-url { display:block; margin:6px 0; color: var(--color-accent); word-break: break-all; overflow-wrap:anywhere; max-height: 3.4em; overflow:auto; font-size: var(--text-xs); line-height:1.3; }
    .pay-status { display:inline-block; padding:2px 8px; border-radius:999px; font-weight:600; font-size: var(--text-sm); }
    .pay-status.paid { background: rgba(46,204,113,.15); color:#2ecc71; }
    .pay-status.pending { background: rgba(245,110,46,.15); color:#F56E2E; }
    .pay-status.none { background: rgba(255,255,255,.06); color: var(--color-text-faint); }
    .pay-note { color: var(--color-text-faint); margin-top:6px; }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <h1>BeatsByBayo <span style="font-size:var(--text-sm);color:var(--color-text-faint);font-weight:400;">Admin</span></h1>

    <!-- Login view -->
    <div id="loginView" class="login-card">
      <label>Admin password
        <input type="password" id="pw" placeholder="Password" autocomplete="current-password" />
      </label>
      <button class="btn btn-primary btn-wide" id="loginBtn">Log in</button>
      <p class="err-msg" id="loginErr"></p>
    </div>

    <!-- Dashboard view -->
    <div id="dashView" hidden>
      <button class="logout" id="logoutBtn">Log out</button>

      <div class="pricing-block admin-card">
        <h2>Full pricing (admin only)</h2>
        <div id="pricing"></div>
      </div>

      <div class="admin-card" style="margin-bottom:var(--space-6)">
        <h2>Booked dates</h2>
        <p class="empty" id="bookedDesc" style="margin-bottom:4px">Dates you've confirmed as booked — hidden from public availability.</p>
        <div class="booked-bar" id="bookedBar"></div>
      </div>

      <div class="admin-card" style="margin-bottom:var(--space-6)">
        <h2>Reviews</h2>
        <p class="empty" id="reviewsDesc" style="margin-bottom:8px">Client reviews awaiting approval — approve to publish them on the site.</p>
        <button class="copy-link" id="copyReviewLink">Copy review link to share</button>
        <div id="reviews"></div>
      </div>

      <div class="admin-card">
        <h2>Inquiries</h2>
        <div id="inquiries"></div>
      </div>
    </div>
  </div>

  <script>
    // Same-origin when served by the backend (Render / beatsbybayo.com);
    // falls back to the rewritten __PORT_8000__ proxy for the Perplexity preview.
    var API = '__PORT_8000__';
    if (API.indexOf('__PORT_8000__') !== -1) { API = ''; }
    var token = '';

    function $(id) { return document.getElementById(id); }

    // Login
    $('loginBtn').addEventListener('click', doLogin);
    $('pw').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });

    function doLogin() {
      var pw = $('pw').value;
      $('loginErr').textContent = '';
      fetch(API + '/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw }),
      })
        .then(function (r) { return r.json().then(function (d) { return { s: r.status, d: d }; }); })
        .then(function (res) {
          if (res.s === 200 && res.d.token) {
            token = res.d.token;
            $('loginView').hidden = true;
            $('dashView').hidden = false;
            renderPricing(res.d.pricing);
            loadInquiries();
            loadReviews();
          } else {
            $('loginErr').textContent = 'Incorrect password.';
          }
        })
        .catch(function () { $('loginErr').textContent = 'Could not reach server.'; });
    }

    function renderPricing(p) {
      if (!p) return;
      var h = '';
      h += '<p style="margin-bottom:8px"><strong>$' + p.retainer.amount + '</strong> ' + p.retainer.label + ' — ' + p.retainer.note + '</p>';
      h += '<table><thead><tr><th>Package</th><th>Price</th><th>Hours</th><th>Includes</th></tr></thead><tbody>';
      p.packages.forEach(function (pk) {
        h += '<tr><td>' + pk.name + '</td><td>$' + pk.price + '</td><td>up to ' + pk.hours + 'h</td><td>' + pk.includes + '</td></tr>';
      });
      h += '</tbody></table>';
      h += '<h3 style="margin-top:16px">Add-ons</h3><table><thead><tr><th>Add-on</th><th>Price</th><th>Note</th></tr></thead><tbody>';
      p.addons.forEach(function (a) {
        h += '<tr><td>' + a.name + (a.admin_only ? ' <span class="pill skip">admin-only</span>' : '') + '</td><td>$' + a.price + '</td><td>' + (a.note || '') + '</td></tr>';
      });
      h += '</tbody></table>';
      $('pricing').innerHTML = h;
    }

    function pill(status) {
      var s = (status || '').toLowerCase();
      var cls = 'skip', label = status || '—';
      if (s.indexOf('sent:') === 0 || s === 'sent') { cls = 'sent'; label = 'Delivered'; }
      else if (s.indexOf('fail') === 0 || s.indexOf('error') === 0) { cls = 'fail'; label = 'Failed'; }
      else if (s.indexOf('skip') === 0 || s.indexOf('not_config') === 0) { cls = 'skip'; label = 'Not set up'; }
      return '<span class="pill ' + cls + '">' + label + '</span>';
    }

    function loadInquiries() {
      fetch(API + '/api/admin/inquiries', { headers: { Authorization: 'Bearer ' + token } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var list = d.inquiries || [];
          if (!list.length) { $('inquiries').innerHTML = '<p class="empty">No inquiries yet.</p>'; return; }
          var h = '';
          list.forEach(function (i) {
            var isBooked = String(i.booked) === '1';
            h += '<div class="inq' + (isBooked ? ' booked' : '') + '"><h3>' + esc(i.name) + ' — ' + esc(i.event_type) + (isBooked ? ' <span class="pill sent">Booked</span>' : '') + '</h3>' +
              '<p><strong>Date:</strong> ' + esc(i.event_date) + ' &nbsp; <strong>Venue:</strong> ' + esc(i.venue || '-') + '</p>' +
              '<p><strong>Email:</strong> ' + esc(i.email) + ' &nbsp; <strong>Phone:</strong> ' + esc(i.phone) + '</p>' +
              '<p><strong>Guests:</strong> ' + esc(i.guest_count || '-') + ' &nbsp; <strong>Package:</strong> ' + esc(i.package || 'Not selected') + '</p>' +
              (i.message ? '<p><strong>Notes:</strong> ' + esc(i.message) + '</p>' : '') +
              '<div class="meta"><span>Email: ' + pill(i.notify_email) + '</span><span>Text: ' + pill(i.notify_sms) + '</span><span>Auto-reply: ' + pill(i.notify_autoreply) + '</span><span>Received: ' + new Date(i.created_at).toLocaleString() + '</span></div>' +
              paymentBar(i) +
              '<button class="book-btn' + (isBooked ? ' is-booked' : '') + '" data-id="' + i.id + '" data-booked="' + (isBooked ? '1' : '0') + '">' + (isBooked ? '✓ Booked — unmark' : 'Mark as booked') + '</button>' +
              '<button class="pay-btn" data-id="' + i.id + '" data-name="' + attr(i.name) + '" data-event="' + attr(i.event_type) + '">Create payment link</button>' +
              '<button class="pay-check-btn" data-id="' + i.id + '">Check payment status</button>' +
              '<button class="request-btn" data-name="' + attr(i.name) + '" data-event="' + attr(i.event_type) + '">Request review</button>' +
              '</div>';
          });
          $('inquiries').innerHTML = h;
          // Wire up booked buttons
          document.querySelectorAll('.book-btn').forEach(function (b) {
            b.addEventListener('click', function () { toggleBooked(b.getAttribute('data-id'), b.getAttribute('data-booked') === '1'); });
          });
          // Wire up payment buttons
          document.querySelectorAll('.pay-btn').forEach(function (b) {
            b.addEventListener('click', function () { openPaymentLink(b.getAttribute('data-id'), b.getAttribute('data-name'), b.getAttribute('data-event')); });
          });
          document.querySelectorAll('.pay-check-btn').forEach(function (b) {
            b.addEventListener('click', function () { checkPaymentStatus(b.getAttribute('data-id')); });
          });
          document.querySelectorAll('.copy-pay-link').forEach(function (b) {
            b.addEventListener('click', function () { copyText(b.getAttribute('data-url'), b); });
          });
          // Wire up request-review buttons
          document.querySelectorAll('.request-btn').forEach(function (b) {
            b.addEventListener('click', function () { openRequestReview(b.getAttribute('data-name'), b.getAttribute('data-event')); });
          });
          // Render booked-dates panel
          var bd = list.filter(function (i) { return String(i.booked) === '1' && i.event_date; }).map(function (i) { return i.event_date; });
          var uniq = Array.from(new Set(bd)).sort();
          $('bookedBar').innerHTML = uniq.length ? uniq.map(function (d) { return '<span class="booked-chip">' + d + '</span>'; }).join('') : '<span class="empty">No dates booked yet.</span>';
        })
        .catch(function () { $('inquiries').innerHTML = '<p class="empty">Could not load inquiries.</p>'; });
    }

    function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
    function attr(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

    function toggleBooked(id, currentlyBooked) {
      fetch(API + '/api/admin/inquiries/' + id + '/booked', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ booked: !currentlyBooked }),
      }).then(function () { loadInquiries(); }).catch(function () {});
    }

    // --- Stripe payments (admin-only; amounts never public) ---
    function fmtCents(c) { c = +c || 0; return '$' + (c / 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/, ','); }
    function paymentBar(i) {
      var st = (i.payment_status || '').toLowerCase();
      if (!i.stripe_session_id) return '';
      var cls = st === 'paid' ? 'paid' : st === 'none' || !st ? 'none' : 'pending';
      var label = st === 'paid' ? 'Paid' : (st || 'pending');
      var amt = i.payment_amount_cents ? fmtCents(i.payment_amount_cents) : '';
      var kind = i.payment_kind ? ' (' + esc(i.payment_kind) + ')' : '';
      var hasUrl = !!i.payment_url;
      return '<div class="pay-bar"><span class="pay-status ' + cls + '">' + label + '</span>' +
        (amt ? ' &nbsp; ' + esc(amt) + kind : '') +
        (hasUrl ? '<button class="copy-link copy-pay-link" data-url="' + attr(i.payment_url) + '">Copy payment link</button>' +
         '<span class="pay-url" title="' + attr(i.payment_url) + '">' + esc(i.payment_url) + '</span>' : '') + '</div>';
    }
    function openPaymentLink(id, name, event) {
      var amt = prompt('Enter the dollar amount for ' + name + '\'s ' + (event || 'event') + ' (e.g. 200):', '200');
      if (amt == null) return;
      var amtNum = parseFloat(amt);
      if (!amtNum || amtNum < 1 || amtNum > 50000) { alert('Enter a whole dollar amount between 1 and 50000.'); return; }
      var label = prompt('Label shown to client (optional):', name + ' - ' + (event || 'deposit'));
      var body = { amount: amtNum, kind: 'deposit' };
      if (label != null) body.label = label || 'BeatsByBayo deposit';
      fetch(API + '/api/admin/inquiries/' + id + '/payment-link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify(body),
      }).then(function (r) { return r.json().then(function (d) { return { s: r.status, d: d }; }); })
        .then(function (res) {
          if (res.s === 200 && res.d.url) {
            alert('Payment link created.\n\nShare this link with ' + name + ':\n' + res.d.url);
            loadInquiries();
          } else {
            alert('Could not create link: ' + (res.d.detail || res.d.message || ('status ' + res.s)));
          }
        }).catch(function () { alert('Network error creating payment link.'); });
    }
    function checkPaymentStatus(id) {
      fetch(API + '/api/admin/inquiries/' + id + '/payment-status', { headers: { Authorization: 'Bearer ' + token } })
        .then(function (r) { return r.json().then(function (d) { return { s: r.status, d: d }; }); })
        .then(function (res) {
          if (res.s !== 200) { alert('Could not check status: ' + (res.d.detail || ('status ' + res.s))); return; }
          if (res.d.paid) { alert('Payment confirmed: ' + (res.d.amount_cents ? fmtCents(res.d.amount_cents) : '') + ' (' + (res.d.kind || 'payment') + ').'); }
          else { alert('Not paid yet. Status: ' + res.d.payment_status); }
          loadInquiries();
        }).catch(function () { alert('Network error checking status.'); });
    }
    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(function () {
        var o = btn.textContent; btn.textContent = 'Copied!'; setTimeout(function () { btn.textContent = o; }, 1500);
      }, function () { alert('Copy this link:\n' + text); });
    }

    // --- Reviews ---
    function reviewLink() { return window.location.origin + '/review.html'; }
    function starStr(n) { n = +n || 0; if (n < 0) n = 0; if (n > 5) n = 5; return '★'.repeat(n) + '☆'.repeat(5 - n); }
    function loadReviews() {
      fetch(API + '/api/admin/testimonials', { headers: { Authorization: 'Bearer ' + token } })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var list = d.testimonials || [];
          var pending = list.filter(function (t) { return (t.status || '') === 'pending'; });
          $('reviewsDesc').textContent = pending.length
            ? pending.length + ' review' + (pending.length > 1 ? 's' : '') + ' awaiting approval — approve to publish.'
            : 'No reviews awaiting approval. Share the review link with past clients.';
          if (!list.length) { $('reviews').innerHTML = '<p class="empty">No reviews yet.</p>'; return; }
          var h = '';
          list.forEach(function (t) {
            var st = t.status || 'pending';
            var pend = st === 'pending';
            var pillCls = st === 'approved' ? 'sent' : st === 'rejected' ? 'fail' : 'new';
            var actions = pend
              ? '<div class="actions"><button class="act-btn approve" data-id="' + t.id + '" data-act="approve">Approve</button><button class="act-btn reject" data-id="' + t.id + '" data-act="reject">Reject</button></div>'
              : (st === 'rejected'
                  ? '<div class="actions"><button class="act-btn approve" data-id="' + t.id + '" data-act="approve">Approve</button></div>'
                  : '<div class="actions"><button class="act-btn reject" data-id="' + t.id + '" data-act="reject">Unpublish</button></div>');
            h += '<div class="rev' + (pend ? ' pending' : '') + '">' +
              '<h3>' + esc(t.name) + ' <span class="pill ' + pillCls + '">' + esc(st) + '</span></h3>' +
              '<p><span class="stars">' + starStr(t.rating) + '</span> &nbsp; ' + esc(t.event_type || '-') + ' · ' + new Date(t.created_at).toLocaleString() + '</p>' +
              '<p style="color:var(--color-text)">' + esc(t.testimonial) + '</p>' +
              actions + '</div>';
          });
          $('reviews').innerHTML = h;
          document.querySelectorAll('.act-btn').forEach(function (b) {
            b.addEventListener('click', function () { reviewAction(b.getAttribute('data-id'), b.getAttribute('data-act')); });
          });
        })
        .catch(function () { $('reviews').innerHTML = '<p class="empty">Could not load reviews.</p>'; });
    }
    function reviewAction(id, act) {
      fetch(API + '/api/admin/testimonials/' + id + '/' + act, { method: 'POST', headers: { Authorization: 'Bearer ' + token } })
        .then(function () { loadReviews(); }).catch(function () {});
    }
    function openRequestReview(name, eventType) {
      var first = (name || '').split(' ')[0] || 'there';
      var text = 'Hi ' + first + ', thanks again for having me at your ' + (eventType || 'event') + '! If you enjoyed the night, would you mind leaving a quick review? It really helps: ' + reviewLink();
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }
    $('copyReviewLink').addEventListener('click', function () {
      var link = reviewLink();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(function () { $('copyReviewLink').textContent = 'Copied: ' + link; }, function () { window.prompt('Copy this link:', link); });
      } else { window.prompt('Copy this link:', link); }
    });

    $('logoutBtn').addEventListener('click', function () {
      token = '';
      $('dashView').hidden = true;
      $('loginView').hidden = false;
      $('pw').value = '';
    });
  </script>
</body>
</html>
